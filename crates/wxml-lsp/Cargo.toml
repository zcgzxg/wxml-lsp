[package]
name = "wxml-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Language server for WeChat Mini Program WXML templates"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wxml-backend-tsrs = { path = "../wxml-backend-tsrs" }
wxml-project = { path = "../wxml-project" }
wxml-syntax = { path = "../wxml-syntax" }
wxml-text = { path = "../wxml-text" }
wxml-types = { path = "../wxml-types" }

[features]
# Benchmark-only public surface (`src/bench_support.rs`). Off by default so the
# production crate exposes no extra items; the Criterion target below requires
# it, and `--all-features` in CI keeps the bench code compiling.
bench-support = []

[dev-dependencies]
criterion = { workspace = true }
proptest.workspace = true
sha2.workspace = true
tempfile.workspace = true

[[bench]]
name = "queries"
harness = false
required-features = ["bench-support"]

[lints]
workspace = true
