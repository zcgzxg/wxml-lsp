[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
# Target internal layering (docs/adr/0001-layered-language-service-architecture.md):
#
#   wxml-lsp      ->  wxml-types, wxml-project, wxml-syntax, wxml-text
#   wxml-types    ->  wxml-syntax, wxml-text
#   wxml-project  ->  wxml-text
#   wxml-syntax   ->  wxml-text
#   wxml-text     ->  (none)
#
# Add a crate to this table when the first consumer needs it. Until then the
# members above stay independent and Cargo does not report them as unused.
criterion = "0.8.2"
proptest = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Deliberate exceptions for this workspace's domain vocabulary.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Keep panics out of production paths; tests are exempt via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
# The benchmark feature of `wxml-lsp` is named `bench-support` by the
# `add-query-benchmarks` change; keep the mandated name without a naming lint.
redundant_feature_names = "allow"
