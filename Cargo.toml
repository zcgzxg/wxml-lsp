[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
# Target internal layering (docs/adr/0001-layered-language-service-architecture.md):
#
#   wxml-lsp      ->  wxml-types, wxml-project, wxml-syntax, wxml-text
#   wxml-types    ->  wxml-syntax, wxml-text
#   wxml-project  ->  wxml-text
#   wxml-syntax   ->  wxml-text
#   wxml-text     ->  (none)
#
# Add a crate to this table when the first consumer needs it. Until then the
# members above stay independent and Cargo does not report them as unused.
criterion = "0.8.2"
proptest = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0"

# Build profiles are tuned for the shipped `wxml-lsp` binary (Linux x86_64) and
# for the benchmark loop. `editors/zed/` is a separate workspace with its own
# `[profile.release]`, so nothing here reaches the wasm32-wasip2 extension.
#
# `panic` stays at the default `unwind`: the scheduler, the server and the
# in-process engine isolate a panicking request with `catch_unwind`, and
# `panic = "abort"` would take the whole server down instead.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Strip the symbol table (reclaims ~2.5 MB of the ~30 MB binary); `perf` users
# build the `profiling` profile below. No code here reads a backtrace.
strip = "symbols"

# Dependencies do not need a single codegen unit: thin LTO still merges and
# inlines across crates at link time, while one CGU per dependency serialises
# the codegen of the `tsrs_*` tree. Workspace members keep `codegen-units = 1`.
[profile.release.package."*"]
codegen-units = 16

# Build scripts and proc-macros only run while compiling; release-grade
# optimisation of them is build time spent for no runtime gain.
[profile.release.build-override]
opt-level = 0
codegen-units = 16

# `cargo build --profile profiling -p wxml-lsp` keeps symbols and line tables
# for `perf`/flamegraph without touching the shipped profile above.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# `test` inherits `dev`, so this covers both. The in-process type engine is the
# hot path of every real-engine suite (enabled by `TSGO_TYPINGS_ROOT`), and an
# unoptimised `tsrs_*` dependency tree makes those runs one to two orders of
# magnitude slower. `debug-assertions` stays on because it is a separate knob.
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Deliberate exceptions for this workspace's domain vocabulary.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Keep panics out of production paths; tests are exempt via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
# The benchmark feature of `wxml-lsp` is named `bench-support` by the
# `add-query-benchmarks` change; keep the mandated name without a naming lint.
redundant_feature_names = "allow"
