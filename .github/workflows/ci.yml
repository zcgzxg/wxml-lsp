name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_gates:
        description: "Run the opt-in native gates (requires a pre-provisioned package)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0
      - name: Fetch advisory database
        run: cargo deny fetch db
      - name: Deny advisories, bans, licenses, sources
        run: cargo deny --offline check

  native-package:
    name: v2 native package (no Node, clean PATH)
    runs-on: ubuntu-latest
    env:
      # Pin builtAt so the two independent builds can be compared byte for byte.
      SOURCE_DATE_EPOCH: "1763683200"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-package
      - name: Restore verified locked-asset cache
        id: assets-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/wxml-lsp-release/assets-cache
          key: wxml-assets-${{ hashFiles('assets.lock.json') }}
      - name: Fetch locked asset tarballs for a cold cache
        if: steps.assets-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          from_dir="$RUNNER_TEMP/wxml-from-dir"
          mkdir -p "$from_dir"
          jq -r '.assets[] | [.tarball.url, .tarball.sha256, (.tarball.size | tostring)] | @tsv' \
            assets.lock.json |
          while IFS=$'\t' read -r url sha256 size; do
            file="$from_dir/${url##*/}"
            curl -fsSL --retry 3 --proto '=https' "$url" -o "$file"
            actual_sha="$(sha256sum "$file" | awk '{print $1}')"
            [ "$actual_sha" = "$sha256" ] || {
              echo "SHA-256 mismatch for $file: $actual_sha != $sha256" >&2
              exit 1
            }
            actual_size="$(stat -c '%s' "$file")"
            [ "$actual_size" = "$size" ] || {
              echo "size mismatch for $file: $actual_size != $size" >&2
              exit 1
            }
          done
      - name: Build the v2 package twice with no Node on PATH
        shell: bash
        run: |
          set -euo pipefail
          # Drop hosted-toolcache paths (which contain Node) but keep cargo.
          export PATH="$HOME/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          for tool in node nodejs npm npx pnpm yarn bun; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "no-Node gate: $tool is on PATH at $(command -v "$tool")" >&2
              exit 1
            fi
          done
          from_dir_args=()
          if [ "${{ steps.assets-cache.outputs.cache-hit }}" != "true" ]; then
            from_dir_args+=(--from-dir "$RUNNER_TEMP/wxml-from-dir")
          fi
          scripts/build-release.sh --online --output "$RUNNER_TEMP/release-a" "${from_dir_args[@]}"
          # The second build must reuse only the verified cache: no --from-dir.
          scripts/build-release.sh --online --output "$RUNNER_TEMP/release-b"
      - name: Compare two builds byte for byte
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = "/{print $2; exit}' Cargo.toml)"
          release="wxml-lsp-$version-linux-x86_64"
          a="$RUNNER_TEMP/release-a"
          b="$RUNNER_TEMP/release-b"
          for file in "$release.tar.gz" "$release.tar.gz.sha256" index.json SHA256SUMS; do
            cmp "$a/$file" "$b/$file"
          done
          diff -r "$a/$release" "$b/$release"
          echo "REPRODUCIBLE: two independent v2 builds are byte-identical"
      - name: Save verified locked-asset cache
        if: github.event_name != 'pull_request' && steps.assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/wxml-lsp-release/assets-cache
          key: wxml-assets-${{ hashFiles('assets.lock.json') }}
      - name: Install and verify without Node
        shell: bash
        run: |
          set -euo pipefail
          unset WXML_LSP_BIN   # the installer must use --root, not a caller export
          version="$(awk -F'"' '/^version = "/{print $2; exit}' Cargo.toml)"
          release="$RUNNER_TEMP/release-a/wxml-lsp-$version-linux-x86_64"
          root="$RUNNER_TEMP/install-root"
          "$release/bin/wxml-lsp-install" install \
            --root "$root" \
            --from-dir "$RUNNER_TEMP/release-a" \
            --version "$version" \
            --offline
          "$release/bin/wxml-lsp-install" verify --root "$root"
          TSGO_BIN="$root/current/engine/lib/tsc" \
            WXML_REQUIRE_REAL_ENGINE=1 \
            scripts/verify-no-node.sh \
              --installer "$release/bin/wxml-lsp-install" \
              --root "$root"

  # Opt-in P7 native gate job. The pinned 7.1.0-beta engine (24,522,912 bytes)
  # is not vendored in this repository, so this job requires a pre-provisioned
  # package on the runner. Configure repository variables:
  #   TSGO_NATIVE_PACKAGE  absolute path to an installed v2 package containing
  #                        engine/lib/tsc and typings/ (required)
  #   TSGO_NATIVE_TYPINGS  optional absolute typings root override
  #   TSGO_NATIVE_RUNNER   optional runner label (defaults to ubuntu-latest);
  #                        use a self-hosted Linux x86_64 runner with the
  #                        package mounted
  # The package path may also be supplied as the TSGO_NATIVE_PACKAGE secret
  # (for example when a private provisioning step writes it); the variable
  # takes precedence. When requested, a missing package fails the job
  # explicitly; it never skips.
  # Gate composition (40): 23 native_engine_real + 3 symbols_edits + 9
  # stdio_type_loop + 1 G-P5-PERF-01 + 1 G-P5-STABILITY-01 + 3 real_matrix.
  native-gates:
    name: native gates (opt-in, real engine)
    if: github.event_name == 'workflow_dispatch' && inputs.native_gates
    runs-on: ${{ vars.TSGO_NATIVE_RUNNER != '' && vars.TSGO_NATIVE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      TSGO_NATIVE_PACKAGE: ${{ vars.TSGO_NATIVE_PACKAGE }}
      TSGO_NATIVE_PACKAGE_SECRET: ${{ secrets.TSGO_NATIVE_PACKAGE }}
      TSGO_NATIVE_TYPINGS: ${{ vars.TSGO_NATIVE_TYPINGS }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-gates
      - name: Require a pre-provisioned native package
        shell: bash
        run: |
          set -euo pipefail
          package="${TSGO_NATIVE_PACKAGE:-${TSGO_NATIVE_PACKAGE_SECRET:-}}"
          if [ -z "$package" ]; then
            echo "::error::native-gates needs repository variable or secret TSGO_NATIVE_PACKAGE (absolute path to an installed v2 package with engine/lib/tsc and typings/); refusing to skip."
            exit 1
          fi
          if [ ! -d "$package" ]; then
            echo "::error::TSGO_NATIVE_PACKAGE does not exist on this runner: $package"
            exit 1
          fi
          if [ -n "${TSGO_NATIVE_TYPINGS:-}" ] && [ ! -d "$TSGO_NATIVE_TYPINGS" ]; then
            echo "::error::TSGO_NATIVE_TYPINGS does not exist on this runner: $TSGO_NATIVE_TYPINGS"
            exit 1
          fi
      - name: Run the 40 native gates
        shell: bash
        run: |
          set -euo pipefail
          package="${TSGO_NATIVE_PACKAGE:-${TSGO_NATIVE_PACKAGE_SECRET:-}}"
          if [ -z "$package" ]; then
            echo "::error::native-gates needs repository variable or secret TSGO_NATIVE_PACKAGE; refusing to skip."
            exit 1
          fi
          args=(--package "$package" --output "$RUNNER_TEMP/native-gates")
          if [ -n "${TSGO_NATIVE_TYPINGS:-}" ]; then
            args+=(--typings "$TSGO_NATIVE_TYPINGS")
          fi
          scripts/native-gates.sh "${args[@]}"
      - name: Upload native gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gates
          path: ${{ runner.temp }}/native-gates
          if-no-files-found: warn
